version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: swanythree-postgres
    environment:
      POSTGRES_DB: swanythree
      POSTGRES_USER: swanythree
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swanythree_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swanythree -d swanythree"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swanythree-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: swanythree-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swanythree-network

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: swanythree-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-swanyn8n2026}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=swanythree
      - DB_POSTGRESDB_USER=swanythree
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-swanythree_secret_2026}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swanythree-network

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swanythree-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://swanythree:${DB_PASSWORD:-swanythree_secret_2026}@postgres:5432/swanythree
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET:-swanythree_jwt_secret_2026}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - swanythree-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swanythree-frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - swanythree-network

  # MCP Server (for development/testing)
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: swanythree-mcp
    environment:
      - SWANYTHREE_API_URL=http://api:3000
      - SWANYTHREE_API_KEY=${MCP_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - swanythree-network
    profiles:
      - development

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local

networks:
  swanythree-network:
    driver: bridge
